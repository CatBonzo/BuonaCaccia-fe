@if (data.azione === 'delete') {
  <h2 mat-dialog-title>Eliminare l'evento?</h2>
  <mat-dialog-content>
    <p>«{{ data.titolo }}» verrà eliminato. Non si torna indietro.</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>No</button>
    <button mat-flat-button type="button" [mat-dialog-close]="true" data-testid="confirm-delete">Sì, elimina</button>
  </mat-dialog-actions>
} @else {
  <h2 mat-dialog-title>Annullare l'evento?</h2>
  <mat-dialog-content>
    <p>«{{ data.titolo }}» verrà annullato e tutti gli iscritti riceveranno il motivo per e-mail.</p>
    <mat-form-field class="full">
      <mat-label>Motivo dell'annullamento</mat-label>
      <textarea matInput rows="3" name="reason" [(ngModel)]="reason" data-testid="cancel-reason"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Non annullare</button>
    <button mat-flat-button type="button" [disabled]="!reason.trim()" [mat-dialog-close]="reason.trim()" data-testid="confirm-cancel">
      Conferma l'annullamento
    </button>
  </mat-dialog-actions>
}
