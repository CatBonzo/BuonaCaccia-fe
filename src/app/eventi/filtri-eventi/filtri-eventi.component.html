<form class="filters" (ngSubmit)="apply()">
  <p-iconfield class="wide">
    <p-inputicon class="pi pi-search" />
    <input pInputText name="q" [(ngModel)]="q" placeholder="Cerca per titolo, luogo, tipo" aria-label="Cerca" data-testid="q" />
  </p-iconfield>
  <p-select
    name="region"
    [options]="regionOptions()"
    optionLabel="name"
    optionValue="code"
    [(ngModel)]="region"
    placeholder="Regione"
    ariaLabel="Regione"
    appendTo="body"
    data-testid="region"
  />
  <p-select
    name="category"
    [options]="categoryOptions"
    optionLabel="name"
    optionValue="code"
    [(ngModel)]="category"
    placeholder="Categoria"
    ariaLabel="Categoria"
    appendTo="body"
    data-testid="category"
  />

  @if (moreFilters()) {
    <p-select
      name="availability"
      [options]="availabilityOptions"
      optionLabel="name"
      optionValue="code"
      [(ngModel)]="availability"
      placeholder="Disponibilità"
      ariaLabel="Disponibilità"
      appendTo="body"
    />
    <label class="date"><span>Dal</span><input pInputText type="date" name="startFrom" [(ngModel)]="startFrom" /></label>
    <label class="date"><span>Al</span><input pInputText type="date" name="startTo" [(ngModel)]="startTo" /></label>
  }

  <div class="actions">
    <p-button type="submit" label="Cerca" icon="pi pi-search" severity="warn" data-testid="apply" />
    <p-button
      type="button"
      [label]="(moreFilters() ? 'Meno filtri' : 'Altri filtri') + (!moreFilters() && activeFilters() ? ' (' + activeFilters() + ')' : '')"
      [text]="true"
      (onClick)="moreFilters.set(!moreFilters())"
      [attr.aria-expanded]="moreFilters()"
      styleClass="on-dark"
    />
    <p-button type="button" label="Azzera filtri" [text]="true" (onClick)="reset()" styleClass="on-dark" />
  </div>
</form>
