<app-navbar (menuToggle)="drawer.set(true)" />
<div class="shell">
  @if (menu.hasMenu() && !menu.narrow()) {
    <aside class="nav">
      <app-sidebar />
    </aside>
  }
  <div class="content">
    <main><router-outlet /></main>
    <app-footer />
  </div>
</div>
@if (menu.hasMenu() && menu.narrow()) {
  <p-drawer [(visible)]="drawer" position="left" styleClass="drawer" ariaCloseLabel="Chiudi il menu">
    <ng-template #headless>
      <app-sidebar />
    </ng-template>
  </p-drawer>
}
