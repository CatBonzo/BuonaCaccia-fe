<nav aria-label="Menu principale">
  <p class="brand"><i class="pi pi-compass" aria-hidden="true"></i> Buona Caccia</p>
  @for (item of menu.items(); track item.path) {
    @if (item.groupStart) {
      <p class="group">{{ item.group }}</p>
    }
    <a class="item" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="pi" [class]="item.icon" aria-hidden="true"></i>
      <span>{{ item.label }}</span>
    </a>
  }
  @if (session.loggedIn()) {
    <p class="who">
      <span>Accesso come</span>
      <strong>{{ session.fullName() }}</strong>
    </p>
  }
</nav>
