<header class="top">
  @if (menu.narrow() && menu.hasMenu()) {
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      ariaLabel="Apri il menu"
      (onClick)="menuToggle.emit()"
      data-testid="menu-toggle"
    />
  }
  @if (!menu.hasMenu() || menu.narrow()) {
    <a class="brand" routerLink="/eventi"><i class="pi pi-compass" aria-hidden="true"></i> Buona Caccia</a>
  }
  <span class="spacer"></span>
  <p-button
    [icon]="themes.theme() === null ? 'pi pi-desktop' : themes.theme() === 'light' ? 'pi pi-sun' : 'pi pi-moon'"
    [text]="true"
    severity="secondary"
    [ariaLabel]="themes.theme() === null ? 'Tema: come il sistema. Cambia' : themes.theme() === 'light' ? 'Tema: chiaro. Cambia' : 'Tema: scuro. Cambia'"
    (onClick)="themes.cycle()"
    data-testid="theme"
  />
  @if (session.loggedIn()) {
    <a routerLink="/profilo" class="who" data-testid="who"><i class="pi pi-user" aria-hidden="true"></i> {{ session.fullName() }}</a>
    <p-button label="Esci" [text]="true" severity="secondary" (onClick)="logout()" data-testid="logout" />
  } @else {
    <a routerLink="/login" class="p-button p-component login-link" data-testid="login">Accedi</a>
  }
</header>
