<header class="top">
  @if (menu.narrow() && menu.hasMenu()) {
    <button mat-icon-button type="button" aria-label="Apri il menu" (click)="menuToggle.emit()" data-testid="menu-toggle">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
  }
  <a class="brand" routerLink="/eventi"><i class="fa-solid fa-compass" aria-hidden="true"></i> Buona Caccia</a>
  <nav class="links" aria-label="Navigazione del sito">
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" [routerLinkActive]="link.path === '/' ? '' : 'active'" ariaCurrentWhenActive="page" [attr.data-testid]="'nav-' + link.id">{{ link.label }}</a>
    }
  </nav>
  <span class="spacer"></span>
  <button
    mat-icon-button
    type="button"
    class="theme"
    (click)="themes.cycle()"
    [attr.aria-label]="themes.theme() === null ? 'Tema: come il sistema. Cambia' : themes.theme() === 'light' ? 'Tema: chiaro. Cambia' : 'Tema: scuro. Cambia'"
    data-testid="theme"
  >
    <i class="fa-solid" [class]="themes.theme() === null ? 'fa-circle-half-stroke' : themes.theme() === 'light' ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
  </button>
  @if (session.loggedIn()) {
    <a mat-button routerLink="/profilo" class="who" data-testid="who"><i class="fa-solid fa-user" aria-hidden="true"></i> {{ session.fullName() }}</a>
    <button mat-button type="button" data-testid="logout" (click)="logout()">Esci</button>
  } @else {
    <a mat-flat-button routerLink="/login" class="login" data-testid="login"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Accedi</a>
  }
</header>
