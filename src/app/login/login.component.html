<main class="login">
  <header>
    <h1>Accedi</h1>
    <p class="hint">Accesso di prova: scegli chi vuoi essere.</p>
  </header>
  @if (loading()) {
    <p-progressbar mode="indeterminate" [style]="{ height: '4px' }" ariaLabel="Caricamento" />
  }
  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
  <ul class="users">
    @for (user of users(); track user.username) {
      <li>
        <span class="avatar" aria-hidden="true">{{ initials(user) }}</span>
        <span class="who">
          <strong>{{ user.firstName }} {{ user.lastName }}</strong>
          <span>{{ user.label }}</span>
        </span>
        <p-button type="button" [outlined]="true" [label]="'Entra come ' + user.username" [attr.data-user]="user.username" (onClick)="enter(user)" />
      </li>
    }
  </ul>
</main>
